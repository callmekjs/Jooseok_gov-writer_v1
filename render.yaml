services:
  - type: web
    name: policy-writer
    runtime: python
    region: singapore
    plan: free
    buildCommand: |
      pip install -e .
      cd frontend && npm install && npm run build
    startCommand: uvicorn policy_writer.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production          # ★ 🔴 이 줄이 AI 키 공개를 막는 유일한 장치
      - key: PYTHON_VERSION
        value: "3.12"
      - key: OPENAI_API_KEY
        sync: false                # Render 대시보드에서만 관리한다 — value: 를 쓰면(빈 문자열이라도) 배포할 때마다 대시보드의 실제 값을 덮어써 지운다. sync: false 는 Blueprint 갱신 시 이 변수를 건드리지 않고 대시보드 값을 그대로 둔다 (Render 공식 문서: render.com/docs/blueprint-spec).
      - key: ANTHROPIC_API_KEY
        sync: false                # 위와 동일 — Render 대시보드에서만 관리한다 (OPENAI_API_KEY 주석 참고).
      - key: APP_PASSWORD
        sync: false                # 위와 동일 — Render 대시보드에서만 관리한다. 비어 있으면(production) 접속 암호 없이 열리는 게 아니라 fail-closed 로, AI 를 호출하는 모든 유료 라우트뿐 아니라 /api/drafts(작성 이력 조회·삭제)도 503 으로 잠긴다 (common/auth.py require_app_password).
      - key: SUPABASE_URL
        sync: false                # 선택 항목 — 초안 이력 저장 기능에만 쓰인다. 비어 있어도 앱은 정상 동작하고 이력 저장만 조용히 꺼진다 (db/drafts.py is_configured). Render 대시보드에서만 관리한다.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false                # 위와 동일 — 이력 저장 기능용 선택 항목이며, Render 대시보드에서만 관리한다.
